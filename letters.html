<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Georgia', serif;
  }
  .spacex {
    font-size: 160px;
    font-weight: 900;
    letter-spacing: -4px;
    color: #000000;
    line-height: 1;
    text-transform: uppercase;
  }
  .x {
    font-size: 220px;
    font-weight: 900;
    color: #6B3A2A;
    line-height: 1;
    -webkit-text-stroke: 3px #000000;
  }
  .anysphere {
    font-size: 140px;
    font-weight: 900;
    letter-spacing: -2px;
    color: #ffffff;
    -webkit-text-stroke: 4px #6B3A2A;
    line-height: 1;
    text-transform: uppercase;
  }
  .cursor {
    font-size: 48px;
    font-weight: 400;
    letter-spacing: 12px;
    color: #6B3A2A;
    text-transform: lowercase;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="spacex">SpaceX</div>
  <div class="x">X</div>
  <div class="anysphere">Anysphere</div>
  <div class="cursor">cursor</div>
</body>
</html>
